<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Configurações | TechCycle</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="/feed">↻ TechCycle</a><div class="topbar-actions"><span class="user-chip" data-user-name></span><button class="button logout" data-logout>Sair</button></div></header><div class="app-grid"><nav class="sidebar"></nav><main><h1 class="section-title">Configurações</h1><p class="section-subtitle">Personalize sua experiência e proteja sua conta.</p><form id="settings-form" class="post"><h2>Preferências</h2><label class="profile-option"><input id="notifications-enabled" type="checkbox"> <span><strong>Receber notificações</strong><small>Comentários, respostas, curtidas e atualizações.</small></span></label><label class="profile-option"><input id="profile-public" type="checkbox"> <span><strong>Perfil público</strong><small>Permitir que outros usuários vejam seu perfil.</small></span></label><label class="profile-option"><input id="allow-comments" type="checkbox"> <span><strong>Permitir comentários</strong><small>Permitir comentários nas suas publicações.</small></span></label><label class="field">Ordenação padrão da comunidade<select id="default-sort"><option value="recent">Mais recentes</option><option value="rated">Mais avaliadas</option><option value="commented">Mais comentadas</option></select></label><button class="button" type="submit">Salvar preferências</button><p class="message" id="settings-message"></p></form><form id="password-form" class="post"><h2>Alterar senha</h2><label class="field">Senha atual<input name="currentPassword" type="password" required></label><label class="field">Nova senha<input name="newPassword" type="password" minlength="8" required></label><button class="button" type="submit">Alterar senha</button><p class="message" id="password-message"></p></form><section class="post"><h2>Dados e segurança</h2><button class="button compact" id="export-data" type="button">Exportar meus dados</button> <button class="button compact" id="logout-all" type="button">Sair de todos os dispositivos</button><button class="button danger-button" id="delete-account" type="button">Excluir minha conta</button><p class="message" id="security-message"></p></section></main></div></div><script src="/js/auth.js"></script><script src="/js/configuracoes.js"></script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Entrar | TechCycle</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><aside class="auth-intro"><div class="brand brand-with-logo"><img class="brand-logo" src="/assets/images/techcycle-symbol.png" alt="">TechCycle</div><div><h1>Ideias que movem a tecnologia.</h1><p>Uma comunidade para descobrir, compartilhar e dar um novo ciclo ao que importa.</p><div class="intro-pills"><span>Inovacao</span><span>Comunidade</span><span>Impacto</span></div></div></aside>
<main class="auth-card-wrap"><section class="auth-card"><p class="eyebrow">Bem-vindo de volta</p><h2>Entre na sua conta</h2><p class="lead">Continue acompanhando a conversa que transforma o futuro.</p><form id="login-form" novalidate><p class="message" data-auth-message aria-live="polite"></p><label class="field">Nome de usuario<input name="username" autocomplete="username" required pattern="[A-Z][A-Za-z]*" title="Use apenas letras e comece com uma letra maiuscula" placeholder="Ex.: Marina"></label><label class="field">Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><button class="button" type="submit">Entrar</button></form><p class="auth-switch">Ainda nao faz parte? <a href="/cadastro">Crie sua conta</a></p></section></main><script src="/js/auth.js"></script><script src="/js/login.js"></script></body></html>

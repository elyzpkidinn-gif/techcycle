<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Denúncias | TechCycle</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="/feed"><span class="brand-mark">TC</span>TechCycle</a><div class="topbar-actions"><span class="user-chip" data-user-name></span><button class="button logout" data-logout>Sair</button></div></header><main class="reports-page"><p class="eyebrow">Espaço seguro</p><h1 class="section-title">Denúncias</h1><p class="section-subtitle" id="reports-subtitle">Relate uma situação para a equipe responsável analisar.</p><section id="member-report"><form class="report-card" id="report-form"><p class="message" data-report-message aria-live="polite"></p><label class="field">Endereço da ocorrência<input name="address" required maxlength="240" placeholder="Rua, número, bairro e cidade"></label><label class="field">CEP<input name="cep" required pattern="\d{5}-?\d{3}" placeholder="00000-000"></label><label class="field">Contato para retorno<input name="contact" required maxlength="160" placeholder="Preferencialmente seu e-mail"></label><label class="field">Descrição da denúncia<textarea name="description" required maxlength="5000" rows="7" placeholder="Descreva o que aconteceu, quando e onde ocorreu..."></textarea></label><label class="field">Imagem (opcional)<input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="field-help">Envie uma imagem de até 2 MB.</small></label><label class="anonymous-toggle"><input name="isAnonymous" type="checkbox"> <span><strong>Enviar denúncia anônima</strong><small>Seu nome não será exibido aos administradores.</small></span></label><button class="button" type="submit">Enviar denúncia</button></form></section><section id="admin-reports" hidden><div id="reports-list"></div></section></main></div><script src="/js/auth.js"></script><script src="/js/denuncias.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tutoriais | TechCycle</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/comunidade.css"><style>.tutorials-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tutorial-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tutorial-card{overflow:hidden;padding:0}.tutorial-cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#102a43}.tutorial-card video{width:100%;aspect-ratio:16/9;display:block;background:#102a43}.tutorial-info{padding:14px}.tutorial-info h2{margin:0 0 6px;font-size:18px}.tutorial-info p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tutorial-speed{margin-top:9px;padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff}@media(max-width:950px){.tutorial-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.tutorial-grid{grid-template-columns:1fr}.tutorials-toolbar{align-items:stretch;flex-direction:column;gap:12px}}</style></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="/feed"><span class="brand-mark">↻</span>TechCycle</a><div class="topbar-actions"><span class="user-chip" data-user-name></span><button class="button logout" data-logout>Sair</button></div></header><div class="app-grid"><nav class="sidebar"></nav><main><div class="tutorials-toolbar"><div><h1 class="section-title">Tutoriais</h1><p class="section-subtitle">Aprenda com vídeos compartilhados pela comunidade.</p></div><button class="button compact" id="open-tutorial-upload" type="button">＋ Upload</button></div><section id="tutorial-upload" class="post" hidden><form id="tutorial-form"><p class="message" data-form-message aria-live="polite"></p><label class="field">Título<input name="title" maxlength="160" required></label><label class="field">Categoria<select name="categoryId" id="tutorial-category" required><option value="">Selecione uma categoria</option></select></label><label class="field">Descrição<textarea name="content" rows="5" maxlength="5000" required></textarea></label><label class="field">Vídeo <small>MP4, WEBM ou OGG · 1 segundo a 5 minutos · até 128 MB</small><input name="video" type="file" accept="video/mp4,video/webm,video/ogg" required></label><label class="field">Capa do vídeo <small>PNG, JPG, WEBP ou GIF · até 50 MB</small><input name="cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required></label><button class="button" type="submit">Publicar tutorial</button></form></section><section id="tutorials-list" class="tutorial-grid"><p class="section-subtitle">Carregando tutoriais...</p></section></main></div><footer class="app-footer">© 2026 TechCycle. Todos os direitos reservados.</footer></div><script src="/js/auth.js"></script><script src="/js/tutoriais.js"></script></body></html>
